<style>
:root{color-scheme:light;--bg:#f1e8d2;--ink:#111;--red:#b81c0c;--blue:#6e9dc6;--card:#fff8e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Quicksand","Trebuchet MS",Verdana,sans-serif;min-height:100vh;display:flex;justify-content:center;

main{width:100%;max-width:520px;background:var(--bg);border-left:6px solid var(--red);border-right:6px solid var(--red);padding:28px 20px 40px}

main{text-align:center}
button.opt{text-align:center;font-weight:700}
.cover p{font-size:1.1rem;line-height:1.5;margin:6px 8px 26px}
h1{font-family:"Bowlby One SC",Impact,"Arial Black",sans-serif;font-weight:400;font-size:2.6rem;letter-spacing:.04em;margin:0;line-height:1.05;color:var(--ink);text-shadow:3px 3px 0 var(--blue)}
.sub{color:var(--red);font-weight:700;letter-spacing:.35em;text-transform:uppercase;font-size:.85rem;margin:12px 0 26px}
h2{font-size:1.25rem;margin:0 0 16px}
button.opt{display:block;width:100%;text-align:left;margin:0 0 10px;padding:14px;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:10px;cursor:pointer}
button.opt:active,button.opt:hover{border-color:var(--red);background:var(--red);color:#fff}
.start{background:var(--red);color:#fff;border:0;border-radius:999px;padding:16px 38px;font:inherit;font-size:1.15rem;font-weight:700;letter-spacing:.05em;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.start:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.bar{height:6px;background:var(--card);border-radius:3px;margin-bottom:20px}.bar i{display:block;height:100%;background:var(--red);border-radius:3px}
.res{background:var(--card);border:3px solid var(--red);border-radius:14px;padding:20px}
.res .p{color:var(--red);font-size:1.6rem;font-weight:700}
.res h3{font-size:1.7rem;margin:4px 0}
.tag{font-style:italic;margin:0 0 12px}
.code{margin-top:18px;padding:12px;border:2px dashed var(--ink);border-radius:10px;text-align:center}
.code b{display:block;font-size:1.5rem;letter-spacing:.12em;color:var(--red)}
small{opacity:.75}
.off{display:block;font-family:"Bowlby One SC",Impact,sans-serif;font-size:1.5rem;color:var(--ink);margin-bottom:4px}
.lead{margin-top:16px;padding:14px;background:var(--bg);border-radius:10px}
.lead input{width:100%;padding:12px;margin:6px 0 12px;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:10px;text-align:center}
.lead .start{padding:12px 26px;font-size:1rem}
.lead small{display:block;margin-top:10px}

async function lead(code,k){const box=document.getElementById('lead');try{const EM='';if(!EM){box.remove();return}box.hidden=false;document.getElementById('lf').onclick=async()=>{const v=document.getElementById('li').value.trim();const sm=box.querySelector('small');if(v.length<5){sm.textContent='Escribe un email o teléfono válido.';return}try{location.href='mailto:'+EM+'?subject='+encodeURIComponent('Club Kahuna '+code)+'&body='+encodeURIComponent('Mi contacto: '+v+'\nPersonaje: '+k+'\nCódigo: '+code);box.innerHTML='<b>¡Gracias!</b> Ya estás en el club Kahuna 🍔'}catch(e){sm.textContent='No se pudo guardar. Inténtalo de nuevo.'}}}catch(e){box.remove()}}
function start(){app.innerHTML=head+'<div class="cover"><p>Cada personaje tiene su hamburguesa.<br>Responde 4 preguntas y descubre la tuya.</p><button class="start" onclick="ask()">Empezar</button></div>'}
function ask(){const[x,o]=Q[q];app.innerHTML=head+'<div class="bar"><i style="width:'+(q/Q.length*100)+'%"></i></div><h2>'+x+'</h2>'+o.map(a=>'<button class="opt" onclick="pick(\''+a[1]+'\')">'+a[0]+'</button>').join("")}
function pick(k){s[k]=(s[k]||0)+1;q++;q<Q.length?ask():end()}
function end(){const k=Object.keys(s).sort((a,b)=>s[b]-s[a])[0],c=C[k];let code="KAHUNA-"+k.slice(0,2).toUpperCase()+Math.floor(1000+Math.random()*9000);
try{const o=localStorage.getItem("bk_code");if(o)code=o;else localStorage.setItem("bk_code",code);localStorage.setItem("bk_res",k)}catch(e){}
